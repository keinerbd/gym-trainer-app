name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Genera lib/config.dart desde los GitHub Secrets.
      # (config.dart está en .gitignore para no exponer las API keys)
      - name: Create config.dart from secrets
        run: |
          echo "/// Configuración de API keys para la aplicación." > lib/config.dart
          echo "class AppConfig {" >> lib/config.dart
          echo "  /// URL del proyecto Supabase" >> lib/config.dart
          echo "  static const String supabaseUrl = '${{ secrets.SUPABASE_URL }}';" >> lib/config.dart
          echo "  /// Anon Key del proyecto Supabase" >> lib/config.dart
          echo "  static const String supabaseAnonKey = '${{ secrets.SUPABASE_ANON_KEY }}';" >> lib/config.dart
          echo "  /// API Key de Groq para el entrenador con IA" >> lib/config.dart
          echo "  static const String groqApiKey = '${{ secrets.GROQ_API_KEY }}';" >> lib/config.dart
          echo "}" >> lib/config.dart

      - name: Build web
        run: flutter build web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2d7acfb36af9220b506218f44930f958
          command: pages deploy build/web --project-name=gym-trainer-app

